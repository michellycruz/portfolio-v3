<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Michelly Cruz — Analista de Sistemas. Portfólio com resumo profissional, experiência, formação, habilidades e projetos."
    />
    <meta name="theme-color" content="#191713" />
    <!-- Prévia ao colar o link no LinkedIn, no WhatsApp e afins. Sem og:image
         de propósito: a foto está em webp e os cartões de prévia pedem jpg/png. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Michelly Cruz" />
    <meta property="og:url" content="https://michellycruz.com.br/" />
    <meta property="og:title" content="Michelly Cruz · Analista de Sistemas" />
    <meta
      property="og:description"
      content="Checkout em React, TypeScript e Go, com apoio de IA e revisão minha. Experiência, projetos, formação e contato."
    />
    <!-- A foto da capa é o maior elemento da primeira tela, e o React só a
         pede depois de montar. Este preload a começa junto com o HTML. O
         endereço e as larguras estão duplicados do portfolio.json e do
         src/lib/foto.ts de propósito, e um teste do backend não deixa os três
         se separarem. -->
    <link
      rel="preload"
      as="image"
      href="/images/foto-pessoal.webp"
      imagesrcset="/images/foto-pessoal-480.webp 480w, /images/foto-pessoal-640.webp 640w, /images/foto-pessoal.webp 880w"
      imagesizes="(min-width: 1024px) 460px, 340px"
      fetchpriority="high"
    />
    <title>Michelly Cruz · Portfólio</title>
    <script>
      // O tema escuro é o padrão desta versão; só cai no claro se a pessoa
      // tiver escolhido claro antes. Roda antes da pintura para não piscar.
      try {
        if (localStorage.getItem('theme') !== 'light') {
          document.documentElement.classList.add('dark');
        }
        // Paleta: sem nada guardado vale a terra, que mora no :root e não
        // precisa de atributo. Só a alternativa é que se marca aqui.
        var p = localStorage.getItem('palette');
        if (p) document.documentElement.dataset.palette = p;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
