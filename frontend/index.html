<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Michelly Cruz — Analista de Sistemas. Portfólio com resumo profissional, experiência, formação, habilidades e projetos."
    />
    <meta name="theme-color" content="#191713" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <title>Michelly Cruz · Portfólio</title>
    <script>
      // O tema escuro é o padrão desta versão; só cai no claro se a pessoa
      // tiver escolhido claro antes. Roda antes da pintura para não piscar.
      try {
        if (localStorage.getItem('theme') !== 'light') {
          document.documentElement.classList.add('dark');
        }
        // Paleta: sem nada guardado vale a terra, que mora no :root e não
        // precisa de atributo. Só a alternativa é que se marca aqui.
        var p = localStorage.getItem('palette');
        if (p) document.documentElement.dataset.palette = p;
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
