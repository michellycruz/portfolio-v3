name: Deploy

# Builda a cada push no master e publica o resultado na release "deploy-latest".
# Quem instala e a propria VPS: um timer systemd consulta essa release e se
# atualiza quando o commit muda (veja .github/DEPLOY.md).
#
# O caminho inverso - o runner entrar por SSH na VPS - nao funciona aqui: o
# firewall da VPS so libera IPs conhecidos e recusa os do GitHub Actions.
# Liberar as faixas do Actions significaria abrir o SSH para boa parte da
# Azure, entao a VPS puxa em vez de receber.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario para criar/atualizar a release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false   # o projeto nao tem dependencias externas, nao ha go.sum

      # As regras que mantem os numeros do site honestos (carga no formato "Nh",
      # area e status numa lista fechada, curso previsto sem data nem carga...)
      # vivem em backend/internal/content/rules_test.go. Rodam antes de qualquer
      # build: um portfolio.json que quebre uma delas nao chega a virar release.
      - name: Testes do backend
        working-directory: backend
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        env:
          # Vazio de proposito: em producao o binario Go serve a SPA e a API na
          # mesma origem, entao as chamadas viram /api/... relativas. Se ficar
          # indefinida, lib/api.ts cai no default http://localhost:8080 e o
          # site publicado tenta falar com a maquina do visitante.
          VITE_API_URL: ''
        run: |
          npm ci
          npm run build

      - name: Build do backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ vars.VPS_ARCH || 'amd64' }}
        run: go build -trimpath -ldflags="-s -w" -o portfolio .

      - name: Empacotar
        run: |
          mkdir -p pkg
          cp backend/portfolio pkg/portfolio
          cp -r frontend/dist pkg/dist
          echo "$GITHUB_SHA" > pkg/COMMIT
          tar -czf portfolio-build.tar.gz -C pkg .
          ls -la portfolio-build.tar.gz

      - name: Publicar na release deploy-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O corpo da release guarda o SHA. A VPS compara com o que ja instalou
          # para decidir se ha algo novo -- e o SHA so aparece aqui depois que o
          # build passou, entao ela nunca baixa um pacote de um commit que
          # ainda estava compilando.
          if gh release view deploy-latest >/dev/null 2>&1; then
            gh release upload deploy-latest portfolio-build.tar.gz --clobber
            gh release edit deploy-latest \
              --title "build ${GITHUB_SHA:0:7}" --notes "$GITHUB_SHA"
          else
            gh release create deploy-latest portfolio-build.tar.gz \
              --target master \
              --title "build ${GITHUB_SHA:0:7}" --notes "$GITHUB_SHA"
          fi
          echo "publicado: $GITHUB_SHA"
